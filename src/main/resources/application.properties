quarkus.application.name=wallet-onboarding
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.swagger-ui.always-include=true
quarkus.http.limits.max-body-size=16K
wallet.storage.path=${WALLET_STORAGE_PATH:data/wallet-store.json}
wallet.mock-kyc.enabled=${WALLET_MOCK_KYC_ENABLED:true}
wallet.mock-kyc.result=${WALLET_MOCK_KYC_RESULT:APPROVED}
# DEMO habilita la verificacion simulada. Cualquier otro valor se trata como produccion: sin proveedor KYC real no se activa ninguna wallet.
wallet.mode=${WALLET_MODE:DEMO}
# Solo true cuando Producto apruebe definicion y fuente (D7 para MAU, D8 para CAC). Mientras tanto se informan como no disponibles.
wallet.metrics.mau-source-approved=${WALLET_METRICS_MAU_APPROVED:false}
wallet.metrics.cac-source-approved=${WALLET_METRICS_CAC_APPROVED:false}
quarkus.smallrye-openapi.info-title=Wallet Peru - onboarding (demo)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Contrato REST del onboarding, verificacion simulada, punto de entrada no transaccional y analitica minima. Importes monetarios en centimos enteros.
wallet.analytics-key=${WALLET_ANALYTICS_KEY:}
%test.wallet.storage.path=target/test-data/wallet-store.json
%test.wallet.analytics-key=analytics-key-only-for-automated-tests